name: Nova offline password validation
on:
  push:
    branches: [main, fix/password-validation-20261113]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  password-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Exercise Web Crypto verifier without accounts or network
        run: node --test tests/password.test.mjs
